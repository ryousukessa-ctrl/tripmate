
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183d35">
<title>TripMate｜旅行プランナー</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b2924;background:#f3f6f3}
*{box-sizing:border-box}
body{margin:0}
header{background:#183d35;color:#fff;padding:22px 18px}
header h1{margin:0;font-size:27px}
header p{margin:5px 0 0;color:#d5e6dc;font-size:13px}
main{max-width:720px;margin:auto;padding:15px 12px 48px}
.card{background:#fff;border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 3px 12px #1b292408}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:13px;margin:10px 0 5px;color:#42564b}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6dfd8;border-radius:9px;background:#fff;color:#1b2924}
textarea{min-height:65px}
button{border:0;border-radius:10px;background:#246b4c;color:#fff;padding:12px 14px;font-weight:650;cursor:pointer}
button.secondary{background:#e8efe9;color:#234b37}
button.danger{background:#fff0ee;color:#9b3025}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions>*{flex:1}
.status{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5ee;border-radius:9px;padding:11px;font-size:13px;margin:10px 0}
.status.error{background:#fff0ee;color:#9b3025}
.muted,small{color:#718078;font-size:12px}
.hidden{display:none!important}
.item{border-bottom:1px solid #edf1ed;padding:11px 0;display:flex;justify-content:space-between;gap:10px}
.item:last-child{border:0}
.item p{font-size:13px;color:#64736a;margin:5px 0 0;white-space:pre-wrap}
.item button{padding:7px 10px;font-size:12px;flex-shrink:0}
.total{font-size:26px;font-weight:750}
.check{display:flex;align-items:center;gap:9px;padding:8px 0}
.check input{width:18px}
.check span{flex:1}
hr{border:0;border-top:1px solid #e8eee8;margin:16px 0}
</style>
</head>
<body>
<header>
<h1>✈️ TripMate</h1>
<p>ふたりの旅行を、ひとつの場所に。</p>
</header>
<main>
<div id="status" class="status">起動しています…</div>

<section class="card" id="authCard">
<h2>ログイン・新規登録</h2>
<p class="muted">メールアドレスと6文字以上のパスワードを入力してください。</p>
<label for="email">メールアドレス</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com">
<label for="password">パスワード</label>
<input id="password" type="password" autocomplete="new-password" minlength="6">
<div class="actions">
<button id="login">ログイン</button>
<button id="signup" class="secondary">新規登録</button>
</div>
</section>

<section id="app" class="hidden">
<section class="card">
<div class="row" style="align-items:center">
<div><b>ログイン中</b><p id="user" class="muted"></p></div>
<button id="logout" class="secondary">ログアウト</button>
</div>
</section>

<section class="card">
<h2>＋ 旅行を作成</h2>
<form id="create">
<label for="title">旅行名</label>
<input id="title" required maxlength="100" placeholder="例：スイス絶景旅行">
<label for="destination">行き先</label>
<input id="destination" required maxlength="150" placeholder="例：スイス">
<div class="row">
<div><label for="start">出発日</label><input id="start" type="date"></div>
<div><label for="end">帰宅日</label><input id="end" type="date"></div>
</div>
<div class="row">
<div><label for="people">人数</label><input id="people" type="number" min="1" max="30" value="2" required></div>
<div><label for="budget">予算（円）</label><input id="budget" type="number" min="0" value="200000"></div>
</div>
<button style="width:100%;margin-top:13px">旅行を作成</button>
</form>
</section>

<section class="card">
<h2>あなたの旅行</h2>
<select id="tripSelect"><option value="">旅行を読み込み中…</option></select>
<div class="actions">
<button id="refresh" class="secondary">再読み込み</button>
<button id="delete" class="danger">旅行を削除</button>
</div>
</section>

<div id="detail" class="hidden">
<section class="card">
<h2 id="tripHeading">旅行詳細</h2>
<p id="tripMeta" class="muted"></p>
<div class="row">
<div><label for="editDestination">行き先</label><input id="editDestination"></div>
<div><label for="editPeople">人数</label><input id="editPeople" type="number" min="1" max="30"></div>
<div><label for="editStart">出発日</label><input id="editStart" type="date"></div>
<div><label for="editEnd">帰宅日</label><input id="editEnd" type="date"></div>
<div><label for="editBudget">予算（円）</label><input id="editBudget" type="number" min="0"></div>
</div>
<button id="saveDetails" style="width:100%;margin-top:12px">概要を保存</button>
</section>

<section class="card">
<h2>💰 費用</h2>
<div id="total" class="total">¥0</div>
<p id="budgetInfo" class="muted"></p>
<form id="expenseForm">
<label for="expenseName">費用の内容</label>
<input id="expenseName" required placeholder="例：ホテル">
<label for="expenseAmount">金額（円）</label>
<input id="expenseAmount" type="number" min="0" required>
<button style="width:100%;margin-top:10px">費用を追加</button>
</form>
<div id="expenses"></div>
</section>

<section class="card">
<h2>🗓️ 日程表</h2>
<form id="eventForm">
<label for="eventDate">日付</label>
<input id="eventDate" type="date" required>
<label for="eventTime">時間</label>
<input id="eventTime" type="time">
<label for="eventName">予定・場所</label>
<input id="eventName" required placeholder="例：湖畔を散歩">
<label for="eventNote">メモ</label>
<textarea id="eventNote" placeholder="住所、予約情報など"></textarea>
<button style="width:100%;margin-top:10px">日程に追加</button>
</form>
<div id="events"></div>
</section>

<section class="card">
<h2>📍 行きたい場所</h2>
<form id="wishForm">
<label for="wishName">場所の名前</label>
<input id="wishName" required placeholder="例：展望台">
<label for="wishNote">メモ・URL</label>
<input id="wishNote">
<button style="width:100%;margin-top:10px">候補を追加</button>
</form>
<div id="wishes"></div>
</section>

<section class="card">
<h2>🎒 持ち物リスト</h2>
<form id="packForm">
<label for="packName">持ち物</label>
<input id="packName" required placeholder="例：充電器">
<button style="width:100%;margin-top:10px">持ち物を追加</button>
</form>
<div id="packs"></div>
</section>
</div>
</section>
</main>

<script>
const SUPABASE_URL = "https://ugxmmqwhkrzjesmvanfj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_2i1Q3OZyKnQM_0BBCIuolw_wx58hShs";

const $ = id => document.getElementById(id);
let sb = null, user = null, trips = [], trip = null, busy = false;

function status(msg, isError = false) {
  $('status').textContent = msg;
  $('status').classList.toggle('error', isError);
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function yen(v) {
  return '¥' + Number(v || 0).toLocaleString('ja-JP');
}

function arrays(k) {
  return Array.isArray(trip?.[k]) ? trip[k] : [];
}

function show() {
  $('authCard').classList.toggle('hidden', !!user);
  $('app').classList.toggle('hidden', !user);
  $('user').textContent = user ? `${user.email} · ユーザーID: ${user.id}` : '';
}

async function safe(fn) {
  try {
    await fn();
  } catch (e) {
    console.error(e);
    status('エラー：' + (e?.message || String(e)), true);
  }
}

async function auth(kind) {
  await safe(async () => {
    if (!sb) throw Error('Supabaseの設定が未完了です。');
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!email || password.length < 6) {
      throw Error('メールアドレスと6文字以上のパスワードを入力してください。');
    }
    const r = kind === 'signup'
      ? await sb.auth.signUp({email, password})
      : await sb.auth.signInWithPassword({email, password});
    if (r.error) throw r.error;

    if (kind === 'signup' && !r.data.session) {
      status('登録リクエストを受け付けました。Supabaseのメール確認が有効な場合は、確認メールのリンクを開いてからログインしてください。');
      return;
    }

    user = r.data.user || r.data.session?.user || null;
    show();
    if (user) await loadTrips(false);
    status(kind === 'signup' ? '登録しました。' : 'ログインしました。');
  });
}

$('login').onclick = () => auth('login');
$('signup').onclick = () => auth('signup');

$('logout').onclick = () => safe(async () => {
  const r = await sb.auth.signOut();
  if (r.error) throw r.error;
  user = null;
  trip = null;
  trips = [];
  show();
  $('detail').classList.add('hidden');
  status('ログアウトしました。');
});

async function loadTrips(keep = true) {
  if (!sb || !user || busy) return;
  busy = true;
  try {
    const old = keep ? (trip?.id || $('tripSelect').value) : '';
    const r = await sb.from('trips').select('*').order('updated_at', {ascending:false});
    if (r.error) throw r.error;

    trips = r.data || [];
    $('tripSelect').innerHTML =
      '<option value="">旅行を選択してください</option>' +
      trips.map(t => `<option value="${esc(t.id)}">${esc(t.title)} · ${esc(t.destination)}</option>`).join('');

    if (old && trips.some(t => t.id === old)) {
      trip = trips.find(t => t.id === old);
      $('tripSelect').value = trip.id;
      render();
    } else {
      trip = null;
      $('detail').classList.add('hidden');
    }
    status(`旅行を${trips.length}件読み込みました。`);
  } catch (e) {
    status('旅行の読み込み失敗：' + e.message, true);
  } finally {
    busy = false;
  }
}

$('refresh').onclick = () => loadTrips(true);
$('tripSelect').onchange = () => {
  trip = trips.find(t => t.id === $('tripSelect').value) || null;
  render();
};

$('create').onsubmit = e => safe(async () => {
  e.preventDefault();
  if (!user) throw Error('ログインしてください。');
  const start = $('start').value || null;
  const end = $('end').value || null;
  if (start && end && end < start) throw Error('帰宅日は出発日以降にしてください。');

  const row = {
    owner_id:user.id,
    members:[user.id],
    title:$('title').value.trim(),
    destination:$('destination').value.trim(),
    trip_type:'海外',
    start_date:start,
    end_date:end,
    people:Number($('people').value),
    budget:Number($('budget').value || 0),
    itinerary:[],
    wishlist:[],
    packing:[],
    expenses:[]
  };

  const r = await sb.from('trips').insert(row).select().single();
  if (r.error) throw r.error;
  e.target.reset();
  await loadTrips(false);
  trip = trips.find(t => t.id === r.data.id) || r.data;
  $('tripSelect').value = trip.id;
  render();
  status('旅行を作成しました。');
});

function render() {
  if (!trip) {
    $('detail').classList.add('hidden');
    return;
  }
  $('detail').classList.remove('hidden');
  $('tripHeading').textContent = trip.title;
  $('tripMeta').textContent = `${trip.destination} · ${trip.people}人 · ${trip.start_date || '日付未定'}〜${trip.end_date || '未定'}`;
  $('editDestination').value = trip.destination || '';
  $('editPeople').value = trip.people || 2;
  $('editStart').value = trip.start_date || '';
  $('editEnd').value = trip.end_date || '';
  $('editBudget').value = trip.budget || 0;
  renderExpenses();
  renderEvents();
  renderWishes();
  renderPacks();
}

async function save(patch, msg = '保存しました。') {
  if (!trip) throw Error('先に旅行を選択してください。');
  const r = await sb.from('trips')
    .update({...patch, updated_at:new Date().toISOString()})
    .eq('id', trip.id)
    .select()
    .single();
  if (r.error) throw r.error;
  trip = r.data;
  trips = trips.map(t => t.id === trip.id ? trip : t);
  render();
  status(msg);
}

$('saveDetails').onclick = () => safe(async () => {
  const start = $('editStart').value || null;
  const end = $('editEnd').value || null;
  if (start && end && end < start) throw Error('帰宅日は出発日以降にしてください。');
  await save({
    destination:$('editDestination').value.trim(),
    people:Number($('editPeople').value),
    start_date:start,
    end_date:end,
    budget:Number($('editBudget').value || 0)
  }, '旅行概要を保存しました。');
});

function renderExpenses() {
  const xs = arrays('expenses');
  const sum = xs.reduce((a, x) => a + Number(x.amount || 0), 0);
  $('total').textContent = yen(sum);
  $('budgetInfo').textContent = `予算 ${yen(trip.budget)} · 残り ${yen(Number(trip.budget || 0) - sum)}`;
  $('expenses').innerHTML = xs.map((x, i) =>
    `<div class="item"><div>${esc(x.name)}<p>${yen(x.amount)}</p></div><button class="danger" data-exp="${i}">削除</button></div>`
  ).join('') || '<p class="muted">費用はまだありません。</p>';
}

$('expenseForm').onsubmit = e => safe(async () => {
  e.preventDefault();
  await save({
    expenses:[...arrays('expenses'), {
      id:crypto.randomUUID(),
      name:$('expenseName').value.trim(),
      amount:Number($('expenseAmount').value)
    }]
  }, '費用を追加しました。');
  e.target.reset();
});

$('expenses').onclick = e => safe(async () => {
  if (e.target.dataset.exp === undefined) return;
  await save({
    expenses:arrays('expenses').filter((_, i) => i !== Number(e.target.dataset.exp))
  }, '費用を削除しました。');
});

function renderEvents() {
  $('events').innerHTML = arrays('itinerary').map((x, i) =>
    `<div class="item"><div><b>${esc(x.date)} ${esc(x.time || '')}</b><p><b>${esc(x.name)}</b><br>${esc(x.note || '')}</p></div><button class="danger" data-event="${i}">削除</button></div>`
  ).join('') || '<p class="muted">日程はまだありません。</p>';
}

$('eventForm').onsubmit = e => safe(async () => {
  e.preventDefault();
  await save({
    itinerary:[...arrays('itinerary'), {
      id:crypto.randomUUID(),
      date:$('eventDate').value,
      time:$('eventTime').value,
      name:$('eventName').value.trim(),
      note:$('eventNote').value.trim()
    }]
  }, '日程を追加しました。');
  e.target.reset();
});

$('events').onclick = e => safe(async () => {
  if (e.target.dataset.event === undefined) return;
  await save({
    itinerary:arrays('itinerary').filter((_, i) => i !== Number(e.target.dataset.event))
  }, '日程を削除しました。');
});

function renderWishes() {
  $('wishes').innerHTML = arrays('wishlist').map((x, i) =>
    `<div class="item"><div><b>${esc(x.name)}</b><p>${esc(x.note || '')}</p></div><button class="danger" data-wish="${i}">削除</button></div>`
  ).join('') || '<p class="muted">候補はまだありません。</p>';
}

$('wishForm').onsubmit = e => safe(async () => {
  e.preventDefault();
  await save({
    wishlist:[...arrays('wishlist'), {
      id:crypto.randomUUID(),
      name:$('wishName').value.trim(),
      note:$('wishNote').value.trim()
    }]
  }, '行きたい場所を追加しました。');
  e.target.reset();
});

$('wishes').onclick = e => safe(async () => {
  if (e.target.dataset.wish === undefined) return;
  await save({
    wishlist:arrays('wishlist').filter((_, i) => i !== Number(e.target.dataset.wish))
  }, '候補を削除しました。');
});

function renderPacks() {
  $('packs').innerHTML = arrays('packing').map((x, i) =>
    `<div class="check item"><input type="checkbox" data-check="${i}" ${x.done ? 'checked' : ''}><span style="${x.done ? 'text-decoration:line-through' : ''}">${esc(x.name)}</span><button class="danger" data-pack="${i}">削除</button></div>`
  ).join('') || '<p class="muted">持ち物はまだありません。</p>';
}

$('packForm').onsubmit = e => safe(async () => {
  e.preventDefault();
  await save({
    packing:[...arrays('packing'), {
      id:crypto.randomUUID(),
      name:$('packName').value.trim(),
      done:false
    }]
  }, '持ち物を追加しました。');
  e.target.reset();
});

$('packs').onclick = e => safe(async () => {
  if (e.target.dataset.pack === undefined) return;
  await save({
    packing:arrays('packing').filter((_, i) => i !== Number(e.target.dataset.pack))
  }, '持ち物を削除しました。');
});

$('packs').onchange = e => safe(async () => {
  if (e.target.dataset.check === undefined) return;
  const i = Number(e.target.dataset.check);
  await save({
    packing:arrays('packing').map((x, j) =>
      j === i ? {...x, done:e.target.checked} : x
    )
  }, '持ち物を更新しました。');
});

$('delete').onclick = () => safe(async () => {
  if (!trip) return;
  if (trip.owner_id !== user.id) throw Error('作成者だけが削除できます。');
  if (!confirm('この旅行を削除しますか？')) return;
  const r = await sb.from('trips').delete().eq('id', trip.id);
  if (r.error) throw r.error;
  trip = null;
  await loadTrips(false);
  status('旅行を削除しました。');
});

async function start() {
  if (!window.supabase) {
    status('Supabaseライブラリを読み込めません。通信を確認してください。', true);
    return;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const r = await sb.auth.getSession();
    if (r.error) throw r.error;
    user = r.data.session?.user || null;
    show();
    if (user) await loadTrips(false);
    else status('メールアドレスとパスワードを入力して新規登録してください。');

    sb.auth.onAuthStateChange((_event, session) => {
      user = session?.user || null;
      show();
      if (user) loadTrips(false);
      else {
        trip = null;
        trips = [];
        $('detail').classList.add('hidden');
      }
    });
  } catch (e) {
    status('初期化エラー：' + e.message, true);
  }
}

start();
</script>
</body>
</html>
